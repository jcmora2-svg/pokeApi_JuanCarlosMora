<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ pokemon?.name | titlecase }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Spinner de carga -->
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando información...</p>
  </div>

  <!-- Contenido de Detalle -->
  <div *ngIf="!loading && pokemon" class="ion-text-center">

    <!-- Imagen Principal y Tipos -->
    <ion-card class="ion-padding" style="background: #f4f5f8; border-radius: 15px;">
      <img [src]="pokemon.sprites.other?.['official-artwork']?.front_default || pokemon.sprites.front_default" 
           [alt]="pokemon.name" 
           style="max-height: 220px; width: auto;" />
      <h2><strong>#{{ pokemon.id }}</strong> - {{ pokemon.name | titlecase }}</h2>

      <!-- Etiquetas de Tipos (Grass, Poison, etc.) -->
      <div>
        <ion-chip *ngFor="let t of pokemon.types" color="medium">
          <ion-label style="font-weight: bold; text-transform: uppercase;">{{ t.type.name }}</ion-label>
        </ion-chip>
      </div>
    </ion-card>

    <!-- Características Físicas (Peso y Altura) -->
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-card class="ion-padding">
            <h3><strong>Altura</strong></h3>
            <p>{{ pokemon.height / 10 }} m</p>
          </ion-card>
        </ion-col>
        <ion-col size="6">
          <ion-card class="ion-padding">
            <h3><strong>Peso</strong></h3>
            <p>{{ pokemon.weight / 10 }} kg</p>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- Estadísticas Base -->
    <ion-card class="ion-text-left ion-padding">
      <h3><strong>Estadísticas Base</strong></h3>
      <div *ngFor="let stat of pokemon.stats" class="ion-margin-bottom">
        <p style="margin: 0; font-size: 14px; text-transform: uppercase;">
          {{ stat.stat.name }}: <strong>{{ stat.base_stat }}</strong>
        </p>
        <ion-progress-bar [value]="stat.base_stat / 150" color="primary"></ion-progress-bar>
      </div>
    </ion-card>

  </div>

</ion-content>
